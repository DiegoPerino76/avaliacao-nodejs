<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda de contatos</title><link rel="stylesheet" href="/style.css"></head><body><main><header><small>CRUD • SEQUELIZE • SQLITE</small><h1>Agenda de contatos</h1><p>Cada contato possui e-mail único; telefone e e-mail são validados.</p></header><section><h2 id="form-title">Novo contato</h2><form id="form"><label for="nome">Nome</label><input id="nome" name="nome" type="text" required >
<label for="email">E-mail</label><input id="email" name="email" type="email" required >
<label for="telefone">Telefone (10 ou 11 dígitos)</label><input id="telefone" name="telefone" type="text" required ><div class="actions"><button id="save">Salvar</button><button id="cancel" type="button" hidden>Cancelar edição</button></div></form></section><section><h2>Contatos</h2><p role="status" id="message"></p><ul id="list"></ul></section></main><script src="/app.js" defer></script></body></html>
